# tmux das sessões de agentes (socket próprio: tmux -L jangada).
# Não interfere no seu tmux pessoal nem no ~/.tmux.conf.

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# O título da janela do terminal passa a ser o nome da sessão. É assim que o
# jangada encontra a janela certa para focar quando um agente pede atenção.
set -g set-titles on
set -g set-titles-string "#S"

# Barra discreta com o nome da sessão (projeto e worktree).
set -g status-position top
set -g status-left "#[bold] #S "
set -g status-left-length 60
set -g status-right "%H:%M "
set -g status-style "bg=default,fg=colour245"

# Ctrl+b d desanexa sem encerrar o agente.
