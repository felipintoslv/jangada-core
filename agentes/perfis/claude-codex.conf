# Claude implementa no worktree do jangada; o Codex revisa o diff;
# leitor e redator vão ao Ollama e os demais papéis ao agy.
# Uso: jangada-agente --perfil claude-codex --nome TAREFA --prompt "..."
# Uma cópia em ~/.config/jangada/agentes/claude-codex.conf tem precedência.
COMANDO=claude
DESCRICAO=Claude implementa, Codex revisa; leitor e redator no Ollama, demais papéis no agy
JANGADA_VALIDAR_REVISOR=codex
JANGADA_DELEGAR=agy
# Piloto explícito: --autor-modelo sonnet ou opus (high).
# A seleção por tarefa fixa o revisor independente em Sol high.
