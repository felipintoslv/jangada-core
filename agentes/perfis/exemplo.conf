# Perfil de agente do jangada. Copie para ~/.config/jangada/agentes/NOME.conf
# e abra com: jangada-agente --perfil NOME
#
# O arquivo é lido linha a linha, sem ser executado. COMANDO e ARGS montam o
# comando da sessão; DESCRICAO é metadado opcional e o seletor calcula a
# descrição efetiva. As demais chaves em maiúsculas viram variáveis de
# ambiente só daquela sessão tmux. Sem COMANDO, vale JANGADA_AGENTE.

COMANDO=claude
DESCRICAO=Claude Opus implementa, Codex revisa
ARGS=--model opus
# ANTHROPIC_BASE_URL=http://localhost:4000
# Abre este perfil fora do bubblewrap:
# JANGADA_AGENTE_ISOLAR=0
# Destino dos subagentes: agy (jangada-delegar manda ao agy; é o dos perfis
# padrão claude-codex e codex-claude), claude (subagentes do próprio Claude)
# ou local (leitor e redator no Ollama, demais papéis na sessão). O agy só
# atende em pasta marcada como confiável nele; se recusar, a sessão principal
# faz o trabalho.
# JANGADA_DELEGAR=claude
# Revisor da entrega: claude, codex, agy, oposto ou mesmo.
# JANGADA_VALIDAR_REVISOR=codex

# Seleção fechada por tarefa, alternativa ao ARGS acima (deixe ARGS vazio):
# JANGADA_AUTOR_MODELO=opus
# JANGADA_AUTOR_ESFORCO=high
# JANGADA_VALIDAR_MODELO=gpt-6.1-sol
# JANGADA_VALIDAR_ESFORCO=high
# Codex aceita gpt-6-luna/medium ou gpt-6.1-sol/high, com revisor opus/high.
